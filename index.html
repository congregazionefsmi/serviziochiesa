
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>Servizio e Salmista – Novembre 2026</title>
  <meta name="description" content="Calendario degli incaricati e dei salmisti della comunità FSMI per novembre 2026.">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="it_IT">
  <meta property="og:title" content="Servizio e Salmista – Novembre 2026">
  <meta property="og:description" content="Calendario degli incaricati e dei salmisti della comunità FSMI.">

  <style>
    :root {
      --navy: #12345a;
      --navy-deep: #0c2746;
      --blue: #1683c6;
      --blue-soft: #eaf6ff;
      --blue-pale: #f4faff;
      --red: #c83d4b;
      --red-soft: #fff0f1;
      --ink: #24364a;
      --muted: #718096;
      --paper: #ffffff;
      --page: #eef4f8;
      --today: #1683c6;
      --shadow: 0 10px 28px rgba(20, 48, 78, .08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 28px 18px 36px;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(74,174,232,.12), transparent 32rem),
        var(--page);
      font-family: Georgia, "Times New Roman", serif;
    }

    .page {
      width: min(1120px, 100%);
      margin: 0 auto;
    }

    .calendar-shell {
      overflow: hidden;
      background: var(--paper);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    /* HEADER */

    .hero {
      position: relative;
      overflow: hidden;
      padding: 30px 34px 27px;
      color: var(--navy);
      background:
        radial-gradient(circle at 94% 18%, rgba(74,174,232,.10), transparent 150px),
        linear-gradient(120deg, #ffffff 0%, #ffffff 68%, #f7fbff 100%);
      border-bottom: 1px solid #e8f1f8;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      right: -42px;
      top: -105px;
      border: 1px solid rgba(22,131,198,.16);
      border-radius: 50%;
      box-shadow:
        0 0 0 17px rgba(22,131,198,.035),
        0 0 0 36px rgba(22,131,198,.025);
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--blue);
      font-family: Arial, sans-serif;
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .19em;
      text-transform: uppercase;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      color: var(--navy);
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 600;
      letter-spacing: .025em;
      line-height: 1.05;
    }

    .subtitle {
      position: relative;
      z-index: 1;
      margin: 11px 0 0;
      color: #718096;
      font-family: Arial, sans-serif;
      font-size: .95rem;
      letter-spacing: .04em;
    }

    .hero-mark {
      position: absolute;
      z-index: 1;
      right: 34px;
      bottom: 27px;
      color: rgba(22,131,198,.55);
      font-size: 2rem;
    }

    /* CONTENT */

    .content {
      padding: 24px 26px 26px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 20px;
      margin: 0 0 18px;
      font-family: Arial, sans-serif;
      font-size: .78rem;
      color: var(--muted);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--blue);
    }

    .legend-dot.red {
      background: var(--red);
    }

    .legend-today {
      width: 15px;
      height: 15px;
      border: 2px solid var(--today);
      border-radius: 5px;
      background: #f0f9ff;
    }

    /* CALENDAR GRID */

    .weekdays,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 9px;
    }

    .weekdays {
      margin-bottom: 9px;
    }

    .weekday {
      padding: 7px 4px;
      color: #728196;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: .69rem;
      font-weight: 700;
      letter-spacing: .12em;
    }

    .weekday:first-child {
      color: var(--red);
    }

    /* DAY CARD */

    .day {
      position: relative;
      display: flex;
      min-height: 125px;
      flex-direction: column;
      padding: 11px 10px 10px;
      border-radius: 15px;
      background: var(--blue-pale);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .day.sunday,
    .day.holiday {
      background: var(--red-soft);
    }

    .day.today {
      z-index: 1;
      outline: 3px solid var(--today);
      outline-offset: 1px;
      background: #e7f5ff;
      box-shadow: 0 5px 18px rgba(22,131,198,.18);
    }

    .day.today.sunday,
    .day.today.holiday {
      background: #ffe8eb;
    }

    .date-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      margin-bottom: 9px;
    }

    .date-number {
      color: var(--blue);
      font-family: Arial, sans-serif;
      font-size: 1.12rem;
      font-weight: 800;
      line-height: 1;
    }

    .sunday .date-number,
    .holiday .date-number {
      color: var(--red);
    }

    .today-label {
      display: none;
      padding: 3px 6px;
      border-radius: 20px;
      color: white;
      background: var(--today);
      font-family: Arial, sans-serif;
      font-size: .54rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .today .today-label {
      display: inline-block;
    }

    /* ASSIGNMENTS */

    .assignments {
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-family: Arial, sans-serif;
      font-size: .72rem;
      line-height: 1.25;
    }

    .assignment {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .role {
      color: #7b8b9b;
      font-size: .55rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .person {
      color: #344a60;
      font-size: .77rem;
      font-weight: 700;
    }

    .today .person {
      color: #173f63;
    }

    /* LOWER PANELS */

    .lower {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 22px;
    }

    .info-panel {
      padding: 17px 19px;
      border-radius: 16px;
      background: #f5f9fc;
    }

    .info-panel h2 {
      margin: 0 0 12px;
      color: var(--navy);
      font-size: 1rem;
      font-weight: 700;
    }

    .counts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      font-family: Arial, sans-serif;
    }

    .count {
      padding: 9px 7px;
      border-radius: 11px;
      background: white;
      text-align: center;
    }

    .count strong {
      display: block;
      color: var(--blue);
      font-size: 1.15rem;
    }

    .count span {
      display: block;
      margin-top: 3px;
      color: #617286;
      font-size: .68rem;
    }

    .footnote {
      margin: 18px 2px 0;
      color: #8a97a6;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: .68rem;
    }

    /* TABLET */

    @media (max-width: 700px) {
      body {
        padding: 10px;
      }

      .calendar-shell {
        border-radius: 18px;
      }

      .hero {
        padding: 24px 21px 22px;
      }

      .hero-mark {
        right: 20px;
        bottom: 20px;
        font-size: 1.55rem;
      }

      .content {
        padding: 18px 14px 20px;
      }

      .weekdays,
      .calendar-grid {
        gap: 5px;
      }

      .weekday {
        padding: 5px 0;
        font-size: .58rem;
        letter-spacing: .02em;
      }

      .day {
        min-height: 112px;
        padding: 8px 6px 7px;
        border-radius: 10px;
      }

      .date-number {
        font-size: .98rem;
      }

      .assignments {
        gap: 6px;
      }

      .role {
        font-size: .49rem;
      }

      .person {
        font-size: .65rem;
      }

      .lower {
        grid-template-columns: 1fr;
        gap: 10px;
      }
    }

    /* PHONE */

    @media (max-width: 480px) {
      body {
        padding: 7px;
      }

      .hero {
        padding: 21px 18px;
      }

      .hero-mark {
        display: none;
      }

      .content {
        padding: 16px 12px 18px;
      }

      .weekdays {
        display: none;
      }

      .calendar-grid {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }

      .day {
        min-height: 0;
        display: grid;
        grid-template-columns: 55px minmax(0, 1fr);
        grid-template-rows: auto;
        column-gap: 10px;
        align-items: center;
        padding: 11px 12px;
        border-radius: 12px;
      }

      .date-row {
        grid-column: 1;
        grid-row: 1;
        align-items: flex-start;
        flex-direction: column;
        gap: 5px;
        margin: 0;
      }

      .date-number {
        font-size: 1.25rem;
      }

      .today-label {
        font-size: .5rem;
      }

      .assignments {
        grid-column: 2;
        grid-row: 1;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 6px 18px;
        align-items: center;
      }

      .assignment {
        min-width: 82px;
        gap: 2px;
      }

      .role {
        font-size: .5rem;
      }

      .person {
        font-size: .76rem;
      }

      .counts {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    /* PRINT */

    @media print {
      @page {
        size: A4 landscape;
        margin: 7mm;
      }

      body {
        padding: 0;
        background: white;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .page {
        width: 100%;
        max-width: none;
      }

      .calendar-shell {
        border-radius: 0;
        box-shadow: none;
      }

      .hero {
        padding: 17px 24px 15px;
      }

      h1 {
        font-size: 2.25rem;
      }

      .content {
        padding: 14px 18px 12px;
      }

      .day {
        min-height: 94px;
        padding: 8px;
      }

      .weekdays,
      .calendar-grid {
        gap: 6px;
      }

      .lower {
        margin-top: 13px;
        gap: 10px;
      }

      .info-panel {
        padding: 11px 14px;
      }

      .footnote {
        margin-top: 9px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="calendar-shell"
      aria-label="Calendario degli incaricati e dei salmisti novembre 2026">

      <header class="hero">
        <p class="eyebrow">Calendario della comunità</p>
        <h1>Novembre 2026</h1>
        <p class="subtitle">Servizio e salmista</p>
        <div class="hero-mark" aria-hidden="true">✦</div>
      </header>

      <div class="content">

        <div class="legend" aria-label="Legenda">
          <span class="legend-item">
            <span class="legend-dot red"></span>
            Domeniche
          </span>

          <span class="legend-item">
            <span class="legend-dot"></span>
            Giorni ordinari
          </span>

          <span class="legend-item">
            <span class="legend-today"></span>
            Oggi
          </span>
        </div>

        <div class="weekdays" aria-hidden="true">
          <div class="weekday">DOM</div>
          <div class="weekday">LUN</div>
          <div class="weekday">MAR</div>
          <div class="weekday">MER</div>
          <div class="weekday">GIO</div>
          <div class="weekday">VEN</div>
          <div class="weekday">SAB</div>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>

        <section class="lower">

          <div class="info-panel">
            <h2>Distribuzione degli incarichi</h2>
            <div class="counts" id="serviceCounts"></div>
          </div>

          <div class="info-panel">
            <h2>Distribuzione dei salmisti</h2>
            <div class="counts" id="psalmistCounts"></div>
          </div>

        </section>

        <p class="footnote">
          «Servite il Signore con gioia» · Calendario della comunità FSMI
        </p>

      </div>
    </section>
  </main>

  <script>
    "use strict";

    /* ==========================================
       INCARICATI E SALMISTI
       Novembre 2026
    ========================================== */

    const assignments = {

      3:  { service: "Ivan",        psalmist: "Harold" },
      4:  { service: "Peter",       psalmist: "Gerald" },
      5:  { service: "Reymarck",    psalmist: "Harold" },
      6:  { service: "Joshua",      psalmist: "Gerald" },
      7:  { service: "Rico",        psalmist: "Harold" },
      8:  { service: "Martin",      psalmist: "Gerald" },
      9:  { service: "Ivan",        psalmist: "Harold" },
      10: { service: "Peter",       psalmist: "Gerald" },
      11: { service: "Reymarck",    psalmist: "Harold" },
      12: { service: "Joshua",      psalmist: "Gerald" },
      13: { service: "Martin",      psalmist: "Harold" },
      14: { service: "Fra Lorenzo", psalmist: "Gerald" },
      15: { service: "Ivan",        psalmist: "Harold" },
      16: { service: "Peter",       psalmist: "Gerald" },
      17: { service: "Reymarck",    psalmist: "Harold" },
      18: { service: "Joshua",      psalmist: "Gerald" },
      19: { service: "Martin",      psalmist: "Harold" },
      20: { service: "Fra Lorenzo", psalmist: "Gerald" },
      21: { service: "Ivan",        psalmist: "Harold" },
      22: { service: "Peter",       psalmist: "Gerald" },
      23: { service: "Reymarck",    psalmist: "Harold" },
      24: { service: "Joshua",      psalmist: "Gerald" },
      25: { service: "Martin",      psalmist: "Harold" },
      26: { service: "Fra Lorenzo", psalmist: "Gerald" },
      27: { service: "Ivan",        psalmist: "Harold" },
      28: { service: "Peter",       psalmist: "Gerald" },
      29: { service: "Reymarck",    psalmist: "Harold" },
      30: { service: "Joshua",      psalmist: "Gerald" }

    };


    /* ==========================================
       CALENDAR SETTINGS
    ========================================== */

    const grid = document.getElementById("calendarGrid");

    const year = 2026;
    const month = 10; // Novembre: gennaio = 0

    const daysInMonth =
      new Date(year, month + 1, 0).getDate();

    const firstWeekday =
      new Date(year, month, 1).getDay();


    /* ==========================================
       DISTRIBUTION COUNTS
    ========================================== */

    function addCount(container, name, count) {

      const item = document.createElement("div");
      item.className = "count";

      const number = document.createElement("strong");
      number.textContent = count;

      const label = document.createElement("span");
      label.textContent = name;

      item.append(number, label);
      container.appendChild(item);
    }


    function renderCounts() {

      const serviceCounts = {};
      const psalmistCounts = {};

      Object.values(assignments).forEach(({ service, psalmist }) => {

        serviceCounts[service] =
          (serviceCounts[service] || 0) + 1;

        psalmistCounts[psalmist] =
          (psalmistCounts[psalmist] || 0) + 1;

      });

      const serviceOrder = [
        "Ivan",
        "Peter",
        "Reymarck",
        "Joshua",
        "Rico",
        "Martin",
        "Fra Lorenzo"
      ];

      serviceOrder.forEach(name => {

        addCount(
          document.getElementById("serviceCounts"),
          name,
          serviceCounts[name] || 0
        );

      });

      ["Harold", "Gerald"].forEach(name => {

        addCount(
          document.getElementById("psalmistCounts"),
          name,
          psalmistCounts[name] || 0
        );

      });

    }


    /* ==========================================
       RENDER CALENDAR
    ========================================== */

    function renderCalendar() {

      grid.innerHTML = "";

      // Empty cells before November 1.
      for (let i = 0; i < firstWeekday; i++) {

        const empty = document.createElement("div");

        empty.className = "day";
        empty.style.visibility = "hidden";
        empty.setAttribute("aria-hidden", "true");

        grid.appendChild(empty);

      }

      const now = new Date();

      const isNovember2026 =
        now.getFullYear() === year &&
        now.getMonth() === month;


      for (let date = 1; date <= daysInMonth; date++) {

        const weekday =
          new Date(year, month, date).getDay();

        const isSunday = weekday === 0;

        const isToday =
          isNovember2026 &&
          now.getDate() === date;

        const card = document.createElement("article");

        card.className = "day";

        if (isSunday) {
          card.classList.add("sunday");
        }

        if (date === 1) {
          card.classList.add("holiday");
        }

        if (isToday) {
          card.classList.add("today");
        }


        /* DATE */

        const dateRow = document.createElement("div");
        dateRow.className = "date-row";

        const number = document.createElement("span");
        number.className = "date-number";
        number.textContent = date;

        const todayLabel = document.createElement("span");
        todayLabel.className = "today-label";
        todayLabel.textContent = "Oggi";

        dateRow.append(number, todayLabel);

        card.appendChild(dateRow);


        /* ASSIGNMENTS */

        const data = assignments[date];

        if (data) {

          const assignmentsBox =
            document.createElement("div");

          assignmentsBox.className = "assignments";

          const entries = [
            ["Incaricato", data.service],
            ["Salmista", data.psalmist]
          ];

          entries.forEach(([roleText, personText]) => {

            const block = document.createElement("div");
            block.className = "assignment";

            const role = document.createElement("span");
            role.className = "role";
            role.textContent = roleText;

            const person = document.createElement("span");
            person.className = "person";
            person.textContent = personText;

            block.append(role, person);

            assignmentsBox.appendChild(block);

          });

          card.appendChild(assignmentsBox);

        } else {

          const emptyLabel = document.createElement("div");

          emptyLabel.className = "person";
          emptyLabel.textContent = "—";

          card.appendChild(emptyLabel);

        }


        if (isToday) {
          card.setAttribute("aria-current", "date");
        }

        grid.appendChild(card);

      }

    }


    /* ==========================================
       INITIALIZE
    ========================================== */

    renderCounts();
    renderCalendar();


    /* ==========================================
       UPDATE TODAY INDICATOR
    ========================================== */

    document.addEventListener("visibilitychange", () => {

      if (!document.hidden) {
        renderCalendar();
      }

    });

    window.addEventListener("focus", renderCalendar);

  </script>

</body>
</html>
