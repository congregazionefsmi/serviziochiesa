
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario dei servizi – Novembre 2026</title>

<style>
:root {
    --navy: #12345a;
    --blue: #1683c6;
    --blue-light: #eaf6ff;
    --blue-soft: #f4faff;
    --red: #c83d4b;
    --text: #26384a;
    --muted: #718096;
    --border: #e3ebf2;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 24px;
    background: #eef4f8;
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 5px 25px rgba(18, 52, 90, 0.07);
}

/* HEADER */

.header {
    position: relative;
    overflow: hidden;
    padding: 18px 10px 26px;
    text-align: center;
    border-bottom: 1px solid var(--border);
}

.header::before,
.header::after {
    content: "";
    position: absolute;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: var(--blue-light);
    opacity: .65;
    z-index: 0;
}

.header::before {
    top: -75px;
    left: 5%;
}

.header::after {
    right: 5%;
    bottom: -95px;
}

.header-content {
    position: relative;
    z-index: 1;
}

.header h1 {
    margin: 0;
    color: var(--navy);
    font-size: 27px;
    font-weight: normal;
}

.month {
    margin-top: 8px;
    color: var(--blue);
    font-size: 36px;
    font-weight: bold;
}

.subtitle {
    margin-top: 7px;
    color: var(--muted);
    font-size: 15px;
}

/* LEGEND */

.legend {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 22px;
    margin: 22px 0;
    color: var(--muted);
    font-family: Arial, sans-serif;
    font-size: 13px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
}

.legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--blue);
}

.legend-dot.sunday {
    background: var(--red);
}

.legend-dot.today {
    background: white;
    border: 2px solid var(--blue);
}

/* CALENDAR */

.weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-bottom: 8px;
    color: var(--navy);
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: bold;
}

.calendar {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 8px;
}

.day {
    position: relative;
    min-height: 125px;
    padding: 12px 9px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: white;
}

.day.empty {
    border: none;
    background: transparent;
}

.day.sunday {
    background: #fffafa;
    border-color: #f3dfe2;
}

.day.today {
    outline: 2px solid var(--blue);
    outline-offset: -2px;
}

.day-number {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 13px;
    color: var(--navy);
    font-family: Arial, sans-serif;
    font-size: 17px;
    font-weight: bold;
}

.sunday .day-number {
    color: var(--red);
}

.today-label {
    padding: 3px 6px;
    border-radius: 10px;
    background: var(--blue);
    color: white;
    font-size: 9px;
    font-weight: normal;
}

.assignment {
    margin-top: 7px;
    font-family: Arial, sans-serif;
    font-size: 12px;
    line-height: 1.35;
}

.assignment-label {
    display: block;
    margin-bottom: 2px;
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .4px;
}

.assignment-name {
    color: var(--navy);
    font-weight: bold;
}

.sunday .assignment-name {
    color: #a83240;
}

/* DISTRIBUTION */

.distribution {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-top: 30px;
}

.distribution-card {
    padding: 20px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: white;
}

.distribution-card h2 {
    margin: 0 0 15px;
    color: var(--navy);
    font-size: 19px;
    font-weight: normal;
}

.person-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid #edf1f5;
    font-family: Arial, sans-serif;
    font-size: 13px;
}

.person-row:last-child {
    border-bottom: none;
}

.person-count {
    color: var(--blue);
    font-weight: bold;
}

.footer {
    margin-top: 25px;
    padding-top: 15px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    text-align: center;
    font-size: 12px;
}

/* MOBILE */

@media (max-width: 700px) {
    body {
        padding: 10px;
    }

    .container {
        padding: 18px 12px;
        border-radius: 13px;
    }

    .header h1 {
        font-size: 21px;
    }

    .month {
        font-size: 30px;
    }

    .weekdays {
        display: none;
    }

    .calendar {
        grid-template-columns: 1fr;
        gap: 7px;
    }

    .day {
        display: grid;
        grid-template-columns: 48px 1fr 1fr;
        align-items: center;
        gap: 8px;
        min-height: auto;
        padding: 11px;
    }

    .day.empty {
        display: none;
    }

    .day-number {
        margin: 0;
        font-size: 16px;
    }

    .assignment {
        margin: 0;
        font-size: 12px;
    }

    .assignment-label {
        font-size: 9px;
    }

    .distribution {
        grid-template-columns: 1fr;
    }
}

/* PRINT */

@media print {
    @page {
        size: A4 landscape;
        margin: 10mm;
    }

    body {
        padding: 0;
        background: white;
    }

    .container {
        max-width: none;
        padding: 0;
        border-radius: 0;
        box-shadow: none;
    }

    .header {
        padding: 8px 10px 15px;
    }

    .header h1 {
        font-size: 20px;
    }

    .month {
        font-size: 27px;
    }

    .legend {
        margin: 12px 0;
    }

    .calendar {
        gap: 5px;
    }

    .day {
        min-height: 100px;
        padding: 7px;
        break-inside: avoid;
    }

    .assignment {
        font-size: 10px;
    }

    .distribution {
        gap: 12px;
        margin-top: 15px;
    }

    .distribution-card {
        padding: 12px;
    }

    .distribution-card h2 {
        margin-bottom: 8px;
        font-size: 15px;
    }

    .person-row {
        padding: 5px 0;
        font-size: 11px;
    }

    .footer {
        margin-top: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">
        <div class="header-content">
            <h1>Calendario dei servizi</h1>
            <div class="month">Novembre 2026</div>
            <div class="subtitle">Servizio e salmista</div>
        </div>
    </header>

    <div class="legend">
        <div class="legend-item">
            <span class="legend-dot sunday"></span>
            Domeniche
        </div>

        <div class="legend-item">
            <span class="legend-dot"></span>
            Giorni ordinari
        </div>

        <div class="legend-item">
            <span class="legend-dot today"></span>
            Oggi
        </div>
    </div>

    <div class="weekdays">
        <div>DOM</div>
        <div>LUN</div>
        <div>MAR</div>
        <div>MER</div>
        <div>GIO</div>
        <div>VEN</div>
        <div>SAB</div>
    </div>

    <div class="calendar" id="calendar"></div>

    <section class="distribution">

        <div class="distribution-card">
            <h2>Distribuzione del servizio</h2>
            <div id="serviceCounts"></div>
        </div>

        <div class="distribution-card">
            <h2>Distribuzione dei salmisti</h2>
            <div id="psalmistCounts"></div>
        </div>

    </section>

    <div class="footer">
        Comunità FSMI · Novembre 2026
    </div>

</div>

<script>
"use strict";

const YEAR = 2026;
const MONTH = 10;

/*
 * ASSEGNAZIONI BASE
 *
 * Questi sono i turni forniti per novembre 2026.
 * La regola dello scambio domenicale viene applicata
 * automaticamente dopo aver creato le assegnazioni.
 */

const serviceNames = [
    "Ivan",
    "Peter",
    "Reymark",
    "Rico",
    "Joshua",
    "Martin",
    "Fra Lorenzo"
];

const assignments = {
    3:  { servizio: "Ivan",        salmista: "Harold" },
    4:  { servizio: "Peter",       salmista: "Gerald" },
    5:  { servizio: "Reymark",     salmista: "Harold" },
    6:  { servizio: "Rico",        salmista: "Gerald" },
    7:  { servizio: "Joshua",      salmista: "Harold" },
    8:  { servizio: "Martin",      salmista: "Gerald" },
    9:  { servizio: "Ivan",        salmista: "Harold" },
    10: { servizio: "Peter",       salmista: "Gerald" },
    11: { servizio: "Reymark",     salmista: "Harold" },
    12: { servizio: "Rico",        salmista: "Gerald" },
    13: { servizio: "Joshua",      salmista: "Harold" },
    14: { servizio: "Martin",      salmista: "Gerald" },
    15: { servizio: "Fra Lorenzo", salmista: "Harold" },
    16: { servizio: "Ivan",        salmista: "Gerald" },
    17: { servizio: "Peter",       salmista: "Harold" },
    18: { servizio: "Reymark",     salmista: "Gerald" },
    19: { servizio: "Rico",        salmista: "Harold" },
    20: { servizio: "Joshua",      salmista: "Gerald" },
    21: { servizio: "Martin",      salmista: "Harold" },
    22: { servizio: "Fra Lorenzo", salmista: "Gerald" },
    23: { servizio: "Ivan",        salmista: "Harold" },
    24: { servizio: "Peter",       salmista: "Gerald" },
    25: { servizio: "Reymark",     salmista: "Harold" },
    26: { servizio: "Rico",        salmista: "Gerald" },
    27: { servizio: "Joshua",      salmista: "Harold" },
    28: { servizio: "Martin",      salmista: "Gerald" },
    29: { servizio: "Fra Lorenzo", salmista: "Harold" },
    30: { servizio: "Ivan",        salmista: "Gerald" }
};

/*
 * REGOLA DELLA DOMENICA
 *
 * Se Fra Lorenzo è assegnato di domenica,
 * scambia il suo turno con il servizio del giorno seguente.
 *
 * Lo scambio riguarda soltanto il servizio.
 * Il salmista non cambia.
 */

const daysInMonth = new Date(YEAR, MONTH + 1, 0).getDate();

for (let day = 3; day < daysInMonth; day++) {

    const date = new Date(YEAR, MONTH, day);
    const isSunday = date.getDay() === 0;

    if (
        isSunday &&
        assignments[day] &&
        assignments[day].servizio === "Fra Lorenzo" &&
        assignments[day + 1]
    ) {
        const followingService = assignments[day + 1].servizio;

        assignments[day].servizio = followingService;
        assignments[day + 1].servizio = "Fra Lorenzo";
    }
}

/* GENERAZIONE DEL CALENDARIO */

const calendar = document.getElementById("calendar");
const firstWeekday = new Date(YEAR, MONTH, 1).getDay();

const today = new Date();

const isCurrentMonth =
    today.getFullYear() === YEAR &&
    today.getMonth() === MONTH;

/* SPAZI VUOTI PRIMA DEL PRIMO GIORNO */

for (let i = 0; i < firstWeekday; i++) {
    const empty = document.createElement("div");
    empty.className = "day empty";
    calendar.appendChild(empty);
}

/* GIORNI DEL MESE */

for (let day = 1; day <= daysInMonth; day++) {

    const date = new Date(YEAR, MONTH, day);
    const isSunday = date.getDay() === 0;
    const isToday = isCurrentMonth && today.getDate() === day;

    const entry = assignments[day];

    const cell = document.createElement("div");
    cell.className = "day";

    if (isSunday) {
        cell.classList.add("sunday");
    }

    if (isToday) {
        cell.classList.add("today");
    }

    /* NUMERO DEL GIORNO */

    const number = document.createElement("div");
    number.className = "day-number";

    const dayNumber = document.createElement("span");
    dayNumber.textContent = day;

    number.appendChild(dayNumber);

    if (isToday) {
        const todayLabel = document.createElement("span");
        todayLabel.className = "today-label";
        todayLabel.textContent = "Oggi";
        number.appendChild(todayLabel);
    }

    cell.appendChild(number);

    /* ASSEGNAZIONI */

    if (entry) {

        const service = document.createElement("div");
        service.className = "assignment";

        const serviceLabel = document.createElement("span");
        serviceLabel.className = "assignment-label";
        serviceLabel.textContent = "Servizio";

        const serviceName = document.createElement("span");
        serviceName.className = "assignment-name";
        serviceName.textContent = entry.servizio;

        service.appendChild(serviceLabel);
        service.appendChild(serviceName);

        const psalmist = document.createElement("div");
        psalmist.className = "assignment";

        const psalmistLabel = document.createElement("span");
        psalmistLabel.className = "assignment-label";
        psalmistLabel.textContent = "Salmista";

        const psalmistName = document.createElement("span");
        psalmistName.className = "assignment-name";
        psalmistName.textContent = entry.salmista;

        psalmist.appendChild(psalmistLabel);
        psalmist.appendChild(psalmistName);

        cell.appendChild(service);
        cell.appendChild(psalmist);

    } else {

        const emptyLabel = document.createElement("div");
        emptyLabel.className = "assignment";
        emptyLabel.textContent = "—";

        cell.appendChild(emptyLabel);
    }

    calendar.appendChild(cell);
}

/* CONTEGGIO DEL SERVIZIO */

const serviceCounts = {};

serviceNames.forEach(name => {
    serviceCounts[name] = 0;
});

Object.values(assignments).forEach(entry => {
    serviceCounts[entry.servizio]++;
});

const serviceContainer = document.getElementById("serviceCounts");

serviceNames.forEach(name => {

    const row = document.createElement("div");
    row.className = "person-row";

    const person = document.createElement("span");
    person.textContent = name;

    const count = document.createElement("span");
    count.className = "person-count";
    count.textContent = serviceCounts[name];

    row.appendChild(person);
    row.appendChild(count);

    serviceContainer.appendChild(row);
});

/* CONTEGGIO DEI SALMISTI */

const psalmistNames = [
    "Harold",
    "Gerald"
];

const psalmistCounts = {};

psalmistNames.forEach(name => {
    psalmistCounts[name] = 0;
});

Object.values(assignments).forEach(entry => {
    psalmistCounts[entry.salmista]++;
});

const psalmistContainer = document.getElementById("psalmistCounts");

psalmistNames.forEach(name => {

    const row = document.createElement("div");
    row.className = "person-row";

    const person = document.createElement("span");
    person.textContent = name;

    const count = document.createElement("span");
    count.className = "person-count";
    count.textContent = psalmistCounts[name];

    row.appendChild(person);
    row.appendChild(count);

    psalmistContainer.appendChild(row);
});
</script>

</body>
</html>
